# ==========================================
# BRASA CAIPIRA — CONFIGURAÇÃO TÉCNICA NETLIFY
# Integração nativa automática OpenNext (Runtime v5)
# Sem fixação manual de @netlify/plugin-nextjs
# ==========================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_SUPABASE_URL = "https://gbaefutcpkplpggtkzxu.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_nMJT4dF_UqZ-hzQ46VxOOw_j6_aWMtB"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_nMJT4dF_UqZ-hzQ46VxOOw_j6_aWMtB"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
